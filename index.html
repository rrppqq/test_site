  <audio id="bg-audio" src="static/your-song.mp3" loop></audio>
  <script>
    const btn = document.getElementById('cd-button');
    const cd_disc = document.getElementById('cd-disc');
    const song_name = document.getElementById('song-name');
    const audio = document.getElementById('bg-audio');
    audio.volume = 0.1;

    btn.addEventListener('click', () => {
      console.log("CLICKED");
      if (audio.paused) {
        cd_disc.classList.add('cd-disk-active')
        audio.play();
        song_name.innerHTML = "THIS COOL SONG";
        btn.setAttribute('aria-pressed', 'true');
        btn.setAttribute('aria-label', 'Pause music');
      } else {
        cd_disc.classList.remove('cd-disk-active')
        audio.pause();
        btn.setAttribute('aria-pressed', 'false');
        song_name.innerHTML = "Zzzz...";
        btn.setAttribute('aria-label', 'Play music');
      }
    });
  </script>

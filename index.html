  <button id="disc-player" class="disc-player" aria-label="Play music" aria-pressed="false">
    <img class="disc-player-img"  src="static/cd_static.png" alt="">
  </button>
  <audio id="bg-audio" src="static/your-song.mp3" loop></audio>
  <script>
    const btn = document.getElementById('disc-player');
    const audio = document.getElementById('bg-audio');
    audio.volume = 0.1;

    btn.addEventListener('click', () => {
      if (audio.paused) {
        btn.children[0].src = "static/cd.gif";
        audio.play();
        btn.classList.add('playing');
        btn.setAttribute('aria-pressed', 'true');
        btn.setAttribute('aria-label', 'Pause music');
      } else {
        btn.children[0].src = "static/cd_static.png";
        audio.pause();
        btn.classList.remove('playing');
        btn.setAttribute('aria-pressed', 'false');
        btn.setAttribute('aria-label', 'Play music');
      }
    });
  </script>
